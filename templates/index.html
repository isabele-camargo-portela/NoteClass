<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteClass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div id="app">

    <!-- Barra superior: recolher painel esquerdo | abas | recolher painel direito -->
    <header id="topbar">
      <button class="icon-btn" id="toggle-left" data-icon="panel-left" title="Mostrar/ocultar painel esquerdo"></button>
      <div id="tabs" role="tablist"></div>
      <button class="icon-btn" id="toggle-right" data-icon="panel-right" title="Mostrar/ocultar sumário"></button>
    </header>

    <div id="workspace">
      <!-- Faixa de ícones -->
      <nav id="ribbon">
        <button class="icon-btn active" data-view="files" data-icon="folder" title="Arquivos"></button>
        <button class="icon-btn" data-view="search" data-icon="search" title="Busca (Ctrl+Shift+F)"></button>
        <button class="icon-btn" data-view="tags" data-icon="tag" title="Tags"></button>
        <button class="icon-btn" data-view="dates" data-icon="calendar" title="Por data"></button>
      </nav>

      <!-- Painel esquerdo -->
      <aside id="left" class="panel">
        <div class="panel-body">
          <section id="view-files" class="view">
            <div class="toolbar">
              <button class="icon-btn" id="btn-new-note" data-icon="pen" title="Nova anotação (Alt+N)"></button>
              <button class="icon-btn" id="btn-new-folder" data-icon="folder-plus" title="Nova pasta"></button>
            </div>
            <div id="tree"></div>
          </section>

          <section id="view-search" class="view" hidden>
            <div class="search-box">
              <input id="f-q" type="search" placeholder="Buscar no título e no texto…" autocomplete="off">
              <div class="row2">
                <label>De <input id="f-from" type="date"></label>
                <label>Até <input id="f-to" type="date"></label>
              </div>
              <input id="f-tag" list="tag-list" placeholder="Filtrar por tag (Enter)" autocomplete="off">
              <div id="f-chips" class="chips"></div>
              <button class="link-btn" id="f-clear">Limpar filtros</button>
            </div>
            <div id="results"></div>
          </section>

          <section id="view-tags" class="view" hidden>
            <div id="tag-view"></div>
          </section>
          <section id="view-dates" class="view" hidden>
            <div id="date-view"></div>
          </section>
        </div>

        <footer class="vault">
          <span class="vault-name"><span data-icon="vault"></span> Cofre 1</span>
          <button class="icon-btn" id="btn-settings" data-icon="settings" title="Configurações"></button>
        </footer>
      </aside>
      <div class="resizer" id="rz-left" title="Arraste para redimensionar (duplo clique restaura)"></div>

      <!-- Área central -->
      <main id="main">
        <div id="empty">
          <p>Nenhum arquivo selecionado…</p>
          <div class="empty-actions">
            <button class="btn" id="empty-note">Criar anotação</button>
            <button class="btn ghost" id="empty-folder">Criar pasta</button>
          </div>
        </div>

        <div id="note" hidden>
          <div id="note-head">
            <input id="title" placeholder="Título da anotação" autocomplete="off">
            <div class="meta">
              <label>Data da aula <input id="note-date" type="date"></label>
              <label>Pasta <select id="note-folder"></select></label>
              <div id="tags-box" class="chips editable">
                <input id="tag-input" list="tag-list" placeholder="Adicionar tag…" autocomplete="off">
              </div>
            </div>
          </div>
          <div id="modebar">
            <div class="seg" id="modes">
              <button data-mode="edit">Editar</button>
              <button data-mode="split">Dividir</button>
              <button data-mode="read">Ler</button>
            </div>
            <button class="icon-btn" id="note-menu" data-icon="more" title="Mais opções"></button>
          </div>
          <div id="panes" class="mode-edit">
            <textarea id="editor" spellcheck="true"
              placeholder="Escreva em Markdown: # título, **negrito**, - lista, - [ ] tarefa…"></textarea>
            <article id="preview"></article>
          </div>
        </div>
      </main>

      <div class="resizer" id="rz-right" title="Arraste para redimensionar (duplo clique restaura)"></div>

      <!-- Painel direito: sumário -->
      <aside id="right" class="panel">
        <div class="panel-body">
          <div class="panel-title"><span data-icon="list"></span> Sumário</div>
          <div class="outline-filter">
            <span data-icon="search"></span>
            <input id="outline-q" placeholder="Filtrar tópicos" autocomplete="off">
          </div>
          <nav id="outline"></nav>
        </div>
        <footer class="stats">
          <span><span data-icon="link" data-size="12"></span> <b id="st-links">0</b> Links</span>
          <span><span data-icon="pen" data-size="12"></span> <b id="st-words">0</b> Palavras</span>
          <span><b id="st-chars">0</b> caracteres</span>
          <span id="save-status" class="save">—</span>
        </footer>
      </aside>
    </div>
  </div>

  <datalist id="tag-list"></datalist>
  <div id="ctx" hidden></div>
  <div id="toast" role="status" hidden></div>

  <dialog id="ask">
    <form method="dialog">
      <label id="ask-label" for="ask-input"></label>
      <input id="ask-input" autocomplete="off">
      <menu>
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <button value="ok" class="btn">Confirmar</button>
      </menu>
    </form>
  </dialog>

  <dialog id="settings">
    <h2>Cofre 1</h2>
    <p>Tudo fica salvo no seu MySQL local.</p>
    <button class="btn" id="export-all">Exportar tudo (.zip de Markdown)</button>
    <h3>Atalhos</h3>
    <dl class="keys">
      <dt>Ctrl+S</dt>
      <dd>Salvar agora</dd>
      <dt>Alt+N</dt>
      <dd>Nova anotação</dd>
      <dt>Ctrl+Shift+F</dt>
      <dd>Abrir busca</dd>
      <dt>Ctrl+B / Ctrl+I</dt>
      <dd>Negrito / itálico</dd>
    </dl>
    <menu><button class="btn ghost" data-close>Fechar</button></menu>
  </dialog>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
